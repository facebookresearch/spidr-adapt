[run]
workdir = "/checkpoint/metaspeechssl/mahiluthra"
wandb_mode = "offline"
wandb_project = "spidr_adapt_codebase"
wandb_name = "spidr_reptile_test_compile"
model_type = "spidr_reset"

[data]
ssl.manifest = "/datasets/metaspeechssl/mahiluthra/split_vad_audio_vp20/vox19_train.csv"
ssl.by_lang = true
ssl.lang_task_chunk_duration = 36000  # in seconds

[meta_update]
method = "reptile"

[validation]
english.manifest = "/datasets/metaspeechssl/shared/assets/manifests/voxpopuli/finetuning/english/finetuning-dev-vadcut.csv"
